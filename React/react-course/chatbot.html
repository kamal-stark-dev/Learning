<!doctype html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      const container = document.querySelector(".js-container");
      const root = ReactDOM.createRoot(container);

      /*
        React components are independent, reusable building blocks used to create user interfaces. Instead of writing an entire web page in one massive file, you break the UI down into smaller, isolated pieces—like a navigation bar, a button, or a profile card—and combine them to build a complete app/website.
      */

      function ChatInput({ chatMessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState("");

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        function sendMessage() {
          const tempChatMessages = [
            ...chatMessages,
            {
              message: inputText,
              sender: "user",
              id: crypto.randomUUID(),
            },
          ];

          setChatMessages(tempChatMessages);

          /* getting response from external chatbot library */
          const response = Chatbot.getResponse(inputText);

          setChatMessages([
            ...tempChatMessages,
            {
              message: response,
              sender: "bot",
              id: crypto.randomUUID(),
            },
          ]);

          setInputText("");
        }

        return (
          <>
            {/* <> </> is a fragment, which allows us to group elements together without creating an extra <div> */}
            <input
              type="text"
              placeholder="Send a message to Chatbot"
              size="30"
              onChange={saveInputText}
              value={inputText}
            />
            <button onClick={sendMessage}>Send</button>
          </>
        );
      }

      function ChatMessage({ message, sender }) {
        // the arguments passed are called props
        return (
          <div>
            {/* && is called the guard operator - if the first statement is true then the second statement runs */}
            {sender === "bot" && <img src="./assets/bot.jpg" width="52px" />}
            {message}
            {sender === "user" && <img src="./assets/user.jpg" width="52px" />}
          </div>
        );
      }

      function ChatMessages({ chatMessages }) {
        return (
          <>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })}
          </>
        );
      }

      function App() {
        /* lifting the state up */
        const [chatMessages, setChatMessages] = React.useState([
          { message: "hello chatbot", sender: "user", id: "id1" },
          {
            message: "Hi, how can I help you today?",
            sender: "bot",
            id: "id2",
          },
          { message: "can you get me todays date?", sender: "user", id: "id3" },
          { message: "Sure, today is November 26", sender: "bot", id: "id4" },
        ]);

        return (
          <>
            Chatbot
            {/* using ChatInput and ChatMessage components */}
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
            <ChatMessages chatMessages={chatMessages} />
          </>
        );
      }

      root.render(<App />);
    </script>
  </body>
</html>
