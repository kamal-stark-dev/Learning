<!doctype html>
<html>
  <head>
    <title>Chatbot</title>

    <style>
      body {
        background-color: #ffe5ec;
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }

      .app-container {
        max-width: 600px;
        margin: auto 8px;

        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .chat-messages-container {
        margin-top: 24px;
        flex-grow: 1;
        overflow: scroll;
        scrollbar-width: none;
      }

      .chat-input-container {
        display: flex;
        margin-bottom: 8px;
      }

      .chat-input {
        padding: 12px 15px;
        border-radius: 8px;
        border: 1px solid black;
        font-size: 15px;
        flex-grow: 1;
      }

      .send-button {
        font-size: 15px;
        color: white;
        cursor: pointer;
        background-color: #fb6f92;
        padding: 12px 20px;
        border-radius: 8px;
        border: none;
        margin-left: 8px;
      }

      .chat-message-user {
        display: flex;
        align-items: start;
        justify-content: end;
      }

      .chat-message-bot {
        display: flex;
        align-items: start;
        justify-content: start;
      }

      .chat-message-text {
        padding: 15px 20px;
        border-radius: 8px;
        margin: 0px 10px 24px 10px;
        background-color: #ffc2d1;
        max-width: 300px;
      }

      .message-sender-profile {
        width: 48px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      const container = document.querySelector(".js-container");
      const root = ReactDOM.createRoot(container);

      /*
        React components are independent, reusable building blocks used to create user interfaces. Instead of writing an entire web page in one massive file, you break the UI down into smaller, isolated pieces—like a navigation bar, a button, or a profile card—and combine them to build a complete app/website.
      */

      function ChatInput({ chatMessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState("");
        const [isLoading, setIsLoading] = React.useState(false);

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        async function sendMessage() {
          if (isLoading || inputText === "") {
            return;
          }

          setIsLoading(true);

          setInputText("");

          const tempChatMessages = [
            ...chatMessages,
            {
              message: inputText,
              sender: "user",
              id: crypto.randomUUID(),
            },
            {
              message: "Loading...",
              sender: "bot",
              id: crypto.randomUUID(),
            },
          ];

          setChatMessages(tempChatMessages);

          /* getting response from external chatbot library */
          const response = await Chatbot.getResponseAsync(inputText);

          setChatMessages([
            /* remove the loading text from bot */
            ...tempChatMessages.slice(0, -1),
            {
              message: response,
              sender: "bot",
              id: crypto.randomUUID(),
            },
          ]);

          setIsLoading(false);
        }

        function handleEnter(event) {
          if (event.key == "Enter") {
            sendMessage();
          } else if (event.key == "Escape") {
            setInputText("");
          }
        }

        return (
          <div className="chat-input-container">
            <input
              className="chat-input"
              type="text"
              placeholder="Send a message to Chatbot"
              size="30"
              onChange={saveInputText}
              onKeyDown={handleEnter}
              value={inputText}
            />
            <button onClick={sendMessage} className="send-button">
              Send
            </button>
          </div>
        );
      }

      function ChatMessage({ message, sender }) {
        // the arguments passed are called props
        return (
          <div
            className={
              sender === "user" ? "chat-message-user" : "chat-message-bot"
            }
          >
            {/* && is called the guard operator - if the first statement is true then the second statement runs */}
            {sender === "bot" && (
              <img className="message-sender-profile" src="./assets/bot.jpg" />
            )}
            <div className="chat-message-text">{message}</div>
            {sender === "user" && (
              <img className="message-sender-profile" src="./assets/user.jpg" />
            )}
          </div>
        );
      }

      function ChatMessages({ chatMessages }) {
        // Hooks - used to insert React features into our components (ex: useState, useEffect, useRef, etc.)
        // Note - put hooks at the top of a component and they should not be inside any block (if-else, funciton, etc.)

        // useRef - lets us automatically save an HTML element from the component (initial value - null)
        const chatMessagesRef = React.useRef(null);

        // useEffect - runs some code after a component is created or updated
        React.useEffect(() => {
          const containerElem = chatMessagesRef.current;
          if (containerElem) {
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        }, [chatMessages]);

        return (
          <div className="chat-messages-container" ref={chatMessagesRef}>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })}
          </div>
        );
      }

      function App() {
        /* lifting the state up */
        const [chatMessages, setChatMessages] = React.useState([
          { message: "hello chatbot", sender: "user", id: "id1" },
          {
            message: "Hi, how can I help you today?",
            sender: "bot",
            id: "id2",
          },
          { message: "can you get me todays date?", sender: "user", id: "id3" },
          { message: "Sure, today is November 26", sender: "bot", id: "id4" },
        ]);

        return (
          <div className="app-container">
            {/* using ChatInput and ChatMessage components */}
            <ChatMessages chatMessages={chatMessages} />
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
          </div>
        );
      }

      root.render(<App />);
    </script>
  </body>
</html>
