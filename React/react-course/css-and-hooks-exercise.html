<!doctype html>
<html>
  <head>
    <title>CSS and Hooks Exercise</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      .heading {
        color: #111;
        padding-bottom: 8px;
        border-bottom: 1px solid #111;
      }

      .btn {
        color: white;
        padding: 8px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      .on {
        background-color: rgb(25 135 84 / 1);
      }

      .off {
        background-color: rgb(220 53 69 / 1);
      }

      .user-input {
        padding: 8px 12px;
        border-radius: 6px;
        margin-bottom: 8px;
        border: 1px solid black;
      }

      .show-password-btn {
        padding: 8px;
        margin-left: 4px;
        border-radius: 6px;
        border: 1px dashed black;
        cursor: pointer;
        background-color: #eee;
      }

      .login-btn {
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        color: white;
        background-color: rgb(0 123 255 / 1);
        margin-right: 6px;
      }

      .auto-click-container button {
        padding: 8px 12px;
        border-radius: 6px;
        border: none;
        margin-right: 4px;
        cursor: pointer;
        background-color: #177e89;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      const container = document.querySelector(".js-container");
      const root = ReactDOM.createRoot(container);

      function Heading({ heading }) {
        return <h2 className="heading">{heading}</h2>;
      }

      function OnOffButton() {
        const [isBtnOn, setIsBtnOn] = React.useState(true);

        function flipBtn() {
          setIsBtnOn(!isBtnOn);
        }

        return (
          <button className={isBtnOn ? "on btn" : "off btn"} onClick={flipBtn}>
            {isBtnOn ? "ON" : "OFF"}
          </button>
        );
      }

      function LoginForm() {
        const [showPassword, setShowPassword] = React.useState(false);

        function changeShowPassword() {
          setShowPassword(!showPassword);
        }

        return (
          <>
            <input className="user-input" type="email" placeholder="Email" />
            <br />
            <input
              className="user-input"
              type={showPassword ? "text" : "password"}
              placeholder="Password"
            />
            <button className="show-password-btn" onClick={changeShowPassword}>
              {showPassword ? "Hide" : "Show"}
            </button>
            <br />
            <button className="login-btn">Login</button>
            <button className="login-btn">Sign up</button>
          </>
        );
      }

      function Clock() {
        const [time, setTime] = React.useState(dayjs().format("HH:mm:ss"));

        React.useEffect(() => {
          setInterval(() => {
            setTime(dayjs().format("hh:mm:ss A (Z)"));
          }, 1000);
        }, []);

        return (
          <>
            Time: <strong>{time}</strong>
          </>
        );
      }

      function AutoCounter() {
        const [count, setCount] = React.useState(0);
        const [autoClicker, setAutoClicker] = React.useState(false);

        function increaseCounter() {
          setCount((prevCount) => prevCount + 1);
        }

        React.useEffect(() => {
          if (!autoClicker) return;

          const intervalId = setInterval(() => {
            setCount((prevCount) => prevCount + 1);
          }, 1000);

          // cleanup function
          return () => {
            clearInterval(intervalId);
          };
        }, [autoClicker]);

        return (
          <div className="auto-click-container">
            <button onClick={increaseCounter}>Clicked {count} times</button>

            <button onClick={() => setCount(0)}>Reset</button>

            <button onClick={() => setAutoClicker((prev) => !prev)}>
              Auto Click: {autoClicker ? "ON" : "OFF"}
            </button>
          </div>
        );
      }

      function App() {
        return (
          <>
            <Heading heading="ON/OFF Button" />
            <OnOffButton />

            <Heading heading="Login Form (Password toggle)" />
            <LoginForm />

            <Heading heading="Clock" />
            <Clock />

            <Heading heading="Counter (Automatic feature)" />
            <AutoCounter />
          </>
        );
      }

      root.render(<App />);
    </script>
  </body>
</html>
