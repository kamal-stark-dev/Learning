<!doctype html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <!-- React is an external library which helps us create and manage websites easier (especially for complex websites) -->

    <!-- react has shared features for both website and mobile apps -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>

    <!-- react-dom has features specific to websites -->
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- Babel is another external library which is a javascript compiler (translates JSX[JS + HTML] into JS code) -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <!-- DayJs library to show today's date -->
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>

    <script type="text/babel">
      // JSX code example
      const button_jsx = <button>Click me!</button>;

      // JS code for the same would look like
      const button_js = document.createElement("button");
      button_js.innerHTML = "Click me!";

      const paragraph = (
        <p>
          <strong>Hello World!</strong> This is some <i>random</i> paragraph.
        </p>
      );

      // mini-exercise
      let productCost = 2 * 8 + 10;
      let shippingCost = 5;

      const shipping_exercise = (
        <div>
          <p>Product cost: ${productCost}</p>
          <p>Shipping cost: ${shippingCost}</p>
          <p>Total cost: ${productCost + shippingCost}</p>

          <button>Place your order</button>
        </div>
      );

      // to render multiple elements we'll store them in a div and render that div
      const time = dayjs().format("HH:mm:ss");

      const div = (
        <div>
          {paragraph}
          {button_jsx}
          <p>Now we can render multiple elements (nice.)</p>

          <hr />
          {shipping_exercise}

          <hr />
          <p>Date: {dayjs().format("MMMM D")}</p>
        </div>
      );

      const container = document.querySelector(".js-container");
      const root = ReactDOM.createRoot(container);
      root.render(div);

      function updateTime() {
        const time = dayjs().format("hh:mm:ss A");

        const div = (
          <div>
            {paragraph}
            {button_jsx}
            <p>Now we can render multiple elements (nice.)</p>

            <hr />
            {shipping_exercise}

            <hr />
            <p>Date: {dayjs().format("MMMM D")}</p>
            <p>Time: {time}</p>
          </div>
        );

        root.render(div);
      }

      setInterval(() => {
        updateTime();
      }, 1000);
    </script>
  </body>
</html>
